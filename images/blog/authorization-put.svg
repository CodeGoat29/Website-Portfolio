<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Authorization testing illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f6fb"/>
      <stop offset="100%" stop-color="#e6eef7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="40" fill="#1f5f99" font-weight="700">Authorization Testing</text>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7a">Request integrity and ownership checks</text>

  <rect x="80" y="190" width="520" height="360" rx="18" fill="#ffffff" stroke="#d6e2f0" stroke-width="3"/>
  <text x="130" y="250" font-family="Courier New, monospace" font-size="22" fill="#2a3f5f">PUT /account</text>
  <text x="130" y="295" font-family="Courier New, monospace" font-size="18" fill="#2a3f5f">user_id: 12345</text>
  <text x="130" y="330" font-family="Courier New, monospace" font-size="18" fill="#2a3f5f">email: user@example.com</text>
  <text x="130" y="365" font-family="Courier New, monospace" font-size="18" fill="#2a3f5f">auth: valid</text>

  <rect x="720" y="230" width="360" height="280" rx="18" fill="#ffffff" stroke="#d6e2f0" stroke-width="3"/>
  <circle cx="900" cy="330" r="70" fill="#1f5f99"/>
  <rect x="865" y="305" width="70" height="50" rx="8" fill="#ffffff"/>
  <rect x="885" y="290" width="30" height="20" rx="6" fill="#ffffff"/>
  <text x="820" y="445" font-family="Arial, sans-serif" font-size="18" fill="#5b6b7a">Access control</text>

  <line x1="600" y1="370" x2="720" y2="370" stroke="#2f7f5f" stroke-width="6"/>
  <polygon points="720,370 700,360 700,380" fill="#2f7f5f"/>

  <text x="120" y="520" font-family="Arial, sans-serif" font-size="18" fill="#5b6b7a">Verify ownership on every request</text>
</svg>
